<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIM BOT - Pair Device</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 50px; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input { padding: 10px; width: 250px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 15px; }
        button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        #code { margin-top: 20px; font-size: 20px; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🤖 NIM BOT Pair Device</h2>
        <p>Creator: <b>Nimsara</b></p>
        <input type="text" id="number" placeholder="Enter number with country code (e.g. 94701234567)">
        <br>
        <button onclick="getPairCode()">Get Pairing Code</button>
        <div id="code"></div>
    </div>

    <script>
        async function getPairCode() {
            const num = document.getElementById('number').value;
            const codeDiv = document.getElementById('code');
            if(!num) { alert('Please enter your phone number!'); return; }
            codeDiv.innerHTML = "Generating code...";
            try {
                const res = await fetch(`/pair?number=${num}`);
                const data = await res.json();
                if(data.code) {
                    codeDiv.innerHTML = `Your Pairing Code: <br><span style="font-size:28px; background:#334155; padding:5px 10px; border-radius:5px; display:inline-block; margin-top:10px;">${data.code}</span>`;
                } else {
                    codeDiv.innerHTML = "Error generating code. Try again.";
                }
            } catch(e) {
                codeDiv.innerHTML = "Failed to connect to server.";
            }
        }
    </script>
</body>
</html>
