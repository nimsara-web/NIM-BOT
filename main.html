<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIM BOT - OFFICIAL</title>
    <!-- Google Font for Modern Anime/Cyber Look -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #050505;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Falling Stars Canvas Background */
        #stars-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Main Glassmorphism Anime Card */
        .card {
            background: rgba(15, 15, 15, 0.85);
            padding: 35px 30px;
            border-radius: 16px;
            border: 2px solid rgba(229, 9, 20, 0.4);
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.3), inset 0 0 15px rgba(229, 9, 20, 0.1);
            text-align: center;
            width: 90%;
            max-width: 420px;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            font-size: 28px;
            color: #ff1e38;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 30, 56, 0.5);
        }

        .card p {
            color: #b3b3b3;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .card p b {
            color: #fff;
        }

        input {
            padding: 12px 15px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: #fff;
            margin-bottom: 20px;
            font-size: 16px;
            font-family: 'Rajdhani', sans-serif;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ff1e38;
            box-shadow: 0 0 8px rgba(255, 30, 56, 0.4);
        }

        button {
            padding: 12px 20px;
            width: 100%;
            background: linear-gradient(135deg, #cc0000, #ff1e38);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            font-family: 'Rajdhani', sans-serif;
        }

        button:hover {
            background: linear-gradient(135deg, #ff1e38, #ff334b);
            box-shadow: 0 0 15px rgba(255, 30, 56, 0.6);
            transform: translateY(-2px);
        }

        #code {
            margin-top: 20px;
            font-size: 18px;
            color: #ff334b;
            font-weight: bold;
        }

        /* Floating Sound Control Icon (Top Right) */
        .sound-icon {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #ff1e38;
            color: #ff1e38;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 10px rgba(255, 30, 56, 0.4);
            font-size: 20px;
            transition: 0.3s;
        }

        .sound-icon:hover {
            background: #ff1e38;
            color: #fff;
        }

        /* Floating Support Icon & Modal (Bottom Right) */
        .support-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 100;
        }

        .support-btn {
            background: #ff1e38;
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 30, 56, 0.6);
            font-size: 26px;
            transition: 0.3s;
            border: 2px solid #fff;
        }

        .support-btn:hover {
            transform: scale(1.1);
            background: #cc0000;
        }

        /* Support Popup Card */
        .support-modal {
            display: none;
            position: absolute;
            bottom: 70px;
            right: 0;
            background: rgba(15, 15, 15, 0.95);
            border: 2px solid #ff1e38;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 30, 56, 0.4);
            text-align: center;
            width: 240px;
            animation: fadeIn 0.3s ease;
        }

        .support-modal h4 {
            color: #ff1e38;
            margin-bottom: 5px;
            font-size: 18px;
        }

        .support-modal p {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            margin: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Falling Stars Canvas -->
    <canvas id="stars-canvas"></canvas>

    <!-- Background Audio (Anime Vibe Loop) -->
    <audio id="bg-audio" loop>
        <source src="https://github.com/nimsara-web/Im-Nim/raw/refs/heads/main/Data/mere%20sapno%20ki%20rani%20x%20the%20box%20audio%20edit%20EV1L7GT_.mp3" type="audio/mpeg">
    </audio>

    <!-- Sound Control Toggle Icon -->
    <div class="sound-icon" id="sound-toggle" onclick="toggleSound()" title="Toggle Music">
        🔇
    </div>

    <!-- Main Card -->
    <div class="card">
        <h2>🤖 NIM BOT</h2>
        <p>Creator: <b>Nimsara</b></p>
        <input type="text" id="number" placeholder="Enter number (e.g. 947********)">
        <button onclick="getPairCode()">Get Pairing Code</button>
        <div id="code"></div>
    </div>

    <!-- Support Icon & Number Popup -->
    <div class="support-container">
        <div class="support-btn" onclick="toggleSupport()" title="Support">
            💬
        </div>
        <div class="support-modal" id="supportModal">
            <h4>Need Help?</h4>
            <p>+94 78 428 0074</p>
        </div>
    </div>

    <script>
        /* --- Falling Stars Background Effect --- */
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const stars = [];
        const numStars = 120;

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 1.5 + 0.5,
                opacity: Math.random()
            });
        }

        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';

            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();

                // Move star downwards
                star.y += star.speed;
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            requestAnimationFrame(animateStars);
        }
        animateStars();

        /* --- Audio Toggle Function --- */
        const audio = document.getElementById('bg-audio');
        const soundToggle = document.getElementById('sound-toggle');
        let isPlaying = false;

        function toggleSound() {
            if (isPlaying) {
                audio.pause();
                soundToggle.innerHTML = '🔇';
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    soundToggle.innerHTML = '🔊';
                    isPlaying = true;
                }).catch(e => {
                    console.log("Audio play blocked:", e);
                });
            }
        }

        /* --- Support Modal Toggle Function --- */
        function toggleSupport() {
            const modal = document.getElementById('supportModal');
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'block';
            }
        }

        /* --- Pair Code Fetch Function --- */
        async function getPairCode() {
            const num = document.getElementById('number').value;
            const codeDiv = document.getElementById('code');
            if (!num) { 
                alert('Please enter your phone number!'); 
                return; 
            }
            codeDiv.innerHTML = "Generating code...";
            try {
                const res = await fetch(`/pair?number=${num}`);
                const data = await res.json();
                if (data.code) {
                    codeDiv.innerHTML = `Your Pairing Code: <br><span style="font-size:26px; background:#1a0000; border: 1px solid #ff1e38; padding:8px 15px; border-radius:6px; display:inline-block; margin-top:10px; color:#ff334b; letter-spacing:1px;">${data.code}</span>`;
                } else {
                    codeDiv.innerHTML = "Error generating code. Try again.";
                }
            } catch (e) {
                codeDiv.innerHTML = "Failed to connect to server.";
            }
        }
    </script>
</body>
</html>
