<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIM BOT - OFFICIAL</title>
    <!-- Google Font for Modern Anime/Cyber Look -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #030712;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Cyan Particles Canvas Background */
        #stars-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Main Glassmorphism Anime Card with Blue Neon */
        .card {
            background: rgba(8, 15, 30, 0.85);
            padding: 35px 30px;
            border-radius: 18px;
            border: 2px solid rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 30px rgba(0, 162, 255, 0.25), inset 0 0 20px rgba(0, 212, 255, 0.1);
            text-align: center;
            width: 90%;
            max-width: 420px;
            z-index: 10;
            backdrop-filter: blur(12px);
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .card h2 {
            font-size: 32px;
            color: #00d4ff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
        }

        .card p {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        .card p b {
            color: #e2e8f0;
        }

        input {
            padding: 14px 18px;
            width: 100%;
            border-radius: 10px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            background: rgba(3, 7, 18, 0.9);
            color: #fff;
            margin-bottom: 20px;
            font-size: 16px;
            font-family: 'Rajdhani', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.5);
            background: rgba(5, 13, 30, 0.95);
        }

        button {
            padding: 14px 20px;
            width: 100%;
            background: linear-gradient(135deg, #0072ff, #00d4ff);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            font-family: 'Rajdhani', sans-serif;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }

        button:hover {
            background: linear-gradient(135deg, #0099ff, #38bdf8);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
            transform: translateY(-3px);
        }

        button:active {
            transform: translateY(-1px);
        }

        #code {
            margin-top: 20px;
            font-size: 18px;
            color: #38bdf8;
            font-weight: bold;
        }

        /* Floating Sound Control Icon (Top Right) */
        .sound-icon {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(8, 15, 30, 0.9);
            border: 2px solid #00d4ff;
            color: #00d4ff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.4);
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .sound-icon:hover {
            background: #00d4ff;
            color: #030712;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
            transform: rotate(15deg);
        }

        /* Floating Support Icon & Modal (Bottom Right) */
        .support-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 100;
        }

        .support-btn {
            background: linear-gradient(135deg, #0072ff, #00d4ff);
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(0, 212, 255, 0.6);
            font-size: 26px;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        .support-btn:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.9);
        }

        /* Support Popup Card */
        .support-modal {
            display: none;
            position: absolute;
            bottom: 70px;
            right: 0;
            background: rgba(8, 15, 30, 0.95);
            border: 2px solid #00d4ff;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            text-align: center;
            width: 240px;
            animation: fadeIn 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .support-modal h4 {
            color: #00d4ff;
            margin-bottom: 5px;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .support-modal p {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            margin: 0;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Falling Slow-Motion Cyan Particles Canvas -->
    <canvas id="stars-canvas"></canvas>

    <!-- Background Audio (Anime Vibe Loop) -->
    <audio id="bg-audio" loop>
        <source src="https://github.com/nimsara-web/Im-Nim/raw/refs/heads/main/Data/MASHUQ%20HAQUE%20-%20AIRTEL%20PHONK%20%20A.%20R.%20RAHMAN%20(PHONK).mp3" type="audio/mpeg">
    </audio>

    <!-- Sound Control Toggle Icon -->
    <div class="sound-icon" id="sound-toggle" onclick="toggleSound()" title="Toggle Music">
        🔇
    </div>

    <!-- Main Card -->
    <div class="card">
        <h2>🤖 NIM BOT</h2>
        <p>Creator: <b>Nimsara</b></p>
        <input type="text" id="number" placeholder="Enter number (e.g. 947********)">
        <button onclick="getPairCode()">Get Pairing Code</button>
        <div id="code"></div>
    </div>

    <!-- Support Icon & Number Popup -->
    <div class="support-container">
        <div class="support-btn" onclick="toggleSupport()" title="Support">
            💬
        </div>
        <div class="support-modal" id="supportModal">
            <h4>Need Help?</h4>
            <p>+94 78 428 0074</p>
        </div>
    </div>

    <script>
        /* --- Slow-Motion Floating Cyan Particle Effect --- */
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        const numParticles = 80;

        for (let i = 0; i < numParticles; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2.5 + 1,
                speed: Math.random() * 0.6 + 0.2, // Slow motion effect
                opacity: Math.random() * 0.8 + 0.2
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                ctx.globalAlpha = p.opacity;
                ctx.fillStyle = '#00d4ff'; // Cyan glowing particles
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00d4ff';
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                // Move particle downwards slowly
                p.y += p.speed;
                if (p.y > height) {
                    p.y = 0;
                    p.x = Math.random() * width;
                }
            });

            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        /* --- Audio Toggle Function --- */
        const audio = document.getElementById('bg-audio');
        const soundToggle = document.getElementById('sound-toggle');
        let isPlaying = false;

        function toggleSound() {
            if (isPlaying) {
                audio.pause();
                soundToggle.innerHTML = '🔇';
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    soundToggle.innerHTML = '🔊';
                    isPlaying = true;
                }).catch(e => {
                    console.log("Audio play blocked:", e);
                });
            }
        }

        /* --- Support Modal Toggle Function --- */
        function toggleSupport() {
            const modal = document.getElementById('supportModal');
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'block';
            }
        }

        /* --- Pair Code Fetch Function (Untouched Logic) --- */
        async function getPairCode() {
            const num = document.getElementById('number').value;
            const codeDiv = document.getElementById('code');
            if (!num) { 
                alert('Please enter your phone number!'); 
                return; 
            }
            codeDiv.innerHTML = "Generating code...";
            try {
                const res = await fetch(`/pair?number=${num}`);
                const data = await res.json();
                if (data.code) {
                    codeDiv.innerHTML = `Your Pairing Code: <br><span style="font-size:26px; background:rgba(3, 7, 18, 0.9); border: 1px solid #00d4ff; padding:8px 15px; border-radius:8px; display:inline-block; margin-top:10px; color:#38bdf8; letter-spacing:2px; box-shadow: 0 0 10px rgba(0, 212, 255, 0.4);">${data.code}</span>`;
                } else {
                    codeDiv.innerHTML = "Error generating code. Try again.";
                }
            } catch (e) {
                codeDiv.innerHTML = "Failed to connect to server.";
            }
        }
    </script>
</body>
</html>
